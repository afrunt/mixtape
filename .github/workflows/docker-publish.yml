name: Build and publish Docker image

# Builds the mixtape.sh runtime image from the Dockerfile and pushes it to
# Docker Hub on every change to main, so afrunt/mixtape:latest always
# reflects the current state of the repository.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions):
#   DOCKERHUB_USERNAME  Docker Hub username (e.g. afrunt).
#   DOCKERHUB_TOKEN      Docker Hub access token (Account Settings ->
#                        Security -> New Access Token), not the account
#                        password.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  IMAGE_NAME: afrunt/mixtape

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
